# Publishes `episodic-cli` to crates.io on a release tag. The first release
# uses a temporary repository-scoped CARGO_REGISTRY_TOKEN secret; later
# releases use OIDC workload identity through crates.io trusted publishing.
#
# After the initial publish, configure trusted publishing for this workflow on
# crates.io and remove the repository CARGO_REGISTRY_TOKEN secret.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish.
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Install Rust stable
        # Plain rustup rather than a third-party action, matching ci.yml.
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # The release build does not run the tests, so they run here: a version
      # published to crates.io cannot be withdrawn, only yanked.
      - name: cargo build
        run: cargo build --release --locked

      - name: cargo test
        run: cargo test --locked --quiet

      - name: cargo publish (dry run)
        run: cargo publish --dry-run --locked

      - name: Select crates.io authentication
        id: auth_method
        env:
          INITIAL_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$INITIAL_TOKEN" ]]; then
            echo "use_oidc=false" >> "$GITHUB_OUTPUT"
          else
            echo "use_oidc=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate with crates.io
        id: crates_io_auth
        if: steps.auth_method.outputs.use_oidc == 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.crates_io_auth.outputs.token }}
        run: cargo publish --locked
