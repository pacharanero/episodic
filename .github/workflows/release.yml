# cargo-dist normally generates this workflow. It is kept by hand instead, with
# the five configured build targets written out explicitly, so that workflow
# data can never become shell code or an unpinned container image: the
# generated form fails `zizmor --strict-collection` on template injection and
# workflow-level `contents: write`. Keep this matrix in step with
# `workspace.metadata.dist` in Cargo.toml, and `allow-dirty = ["ci"]` there
# stops `dist generate` overwriting this file.
#
# Exposed as `workflow_call` so the auto-tag cascade can invoke it: a tag
# pushed with the default GITHUB_TOKEN does not trigger a `push: tags`
# workflow, because of GitHub's anti-recursion guard.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_DIST_VERSION: "0.32.0"

jobs:
  plan:
    name: Plan release
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Verify release plan
        shell: bash
        run: dist plan --tag "$RELEASE_TAG" --output-format=json

  build-local-artifacts:
    name: Build ${{ matrix.target }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      DIST_TARGET: ${{ matrix.target }}
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install cargo-dist (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Install cargo-dist (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: irm "https://github.com/axodotdev/cargo-dist/releases/download/v$env:CARGO_DIST_VERSION/cargo-dist-installer.ps1" | iex
      # The target is re-checked against the known set before it reaches a
      # command line, so a matrix edit cannot smuggle in arguments.
      - name: Build local artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "$DIST_TARGET" in
            aarch64-apple-darwin|aarch64-unknown-linux-gnu|x86_64-apple-darwin|x86_64-unknown-linux-gnu) ;;
            *) echo "Unexpected target: $DIST_TARGET" >&2; exit 1 ;;
          esac
          dist build --tag "$RELEASE_TAG" --artifacts=local --target="$DIST_TARGET" --output-format=json > dist-manifest.json
          cp dist-manifest.json "target/distrib/${DIST_TARGET}-dist-manifest.json"
      - name: Build local artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:DIST_TARGET -ne 'x86_64-pc-windows-msvc') {
            throw "Unexpected target: $env:DIST_TARGET"
          }
          dist build --tag "$env:RELEASE_TAG" --artifacts=local --target="$env:DIST_TARGET" --output-format=json > dist-manifest.json
          Copy-Item dist-manifest.json "target/distrib/$env:DIST_TARGET-dist-manifest.json"
      - name: Upload local artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-local-${{ matrix.target }}
          path: target/distrib/**

  build-global-artifacts:
    name: Build global artifacts
    needs: build-local-artifacts
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Fetch local artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-local-*
          path: target/distrib/
          merge-multiple: true
      # The shell and PowerShell installers and the checksum file are global:
      # they describe every target, so they are built once all five exist.
      - name: Build global artifacts
        shell: bash
        run: |
          dist build --tag "$RELEASE_TAG" --artifacts=global --output-format=json > dist-manifest.json
          cp dist-manifest.json target/distrib/global-dist-manifest.json
      - name: Upload global artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-build-global
          path: target/distrib/**

  host:
    name: Create GitHub release
    needs: build-global-artifacts
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Install cargo-dist
        shell: bash
        run: curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v${CARGO_DIST_VERSION}/cargo-dist-installer.sh" | sh
      - name: Fetch build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        name: Host artifacts
        shell: bash
        run: |
          dist host --tag "$RELEASE_TAG" --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "manifest=$(jq -c '.' dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: Upload release manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: artifacts-build-*
          path: artifacts
          merge-multiple: true
      # Announcement text reaches the shell only through the environment, never
      # through template expansion inside the run block.
      - name: Create GitHub release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
        shell: bash
        run: |
          rm -f artifacts/*-dist-manifest.json
          printf '%s\n' "$ANNOUNCEMENT_BODY" > "$RUNNER_TEMP/notes.txt"
          # `dist build --artifacts=local` leaves an unpacked staging directory
           # (episodic-cli-<target>/) in target/distrib, which the
          # `path: target/distrib/**` upload sweeps into artifacts/. `gh release
          # create` rejects a directory asset, so upload only regular files.
          mapfile -t assets < <(find artifacts -maxdepth 1 -type f)
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" $PRERELEASE_FLAG --title "$ANNOUNCEMENT_TITLE" --notes-file "$RUNNER_TEMP/notes.txt" "${assets[@]}"
