[package]
name = "episodic"
version = "0.1.0"
edition = "2024"
description = "Local-first episode production automation"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["podcast", "video", "automation", "cli"]
categories = ["command-line-utilities", "multimedia"]

[lib]
name = "episodic"
path = "src/lib.rs"

[[bin]]
name = "eps"
path = "src/main.rs"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"] }
clap_complete = "4.6.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
toml = "1.1.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
