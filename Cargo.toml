[package]
name = "episodic"
version = "0.1.0"
edition = "2024"
description = "Local-first episode production automation"
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["podcast", "video", "automation", "cli"]
categories = ["command-line-utilities", "multimedia"]

[lib]
name = "episodic"
path = "src/lib.rs"

[[bin]]
name = "eps"
path = "src/main.rs"

[workspace]
members = ["."]
resolver = "3"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive", "env"] }
clap_complete = "4.6.8"
google-youtube3 = { version = "7.0.0", features = ["yup-oauth2"] }
hyper-rustls = { version = "0.27.9", features = ["http2", "ring", "rustls-native-certs"] }
hyper-util = { version = "0.1.20", features = ["client-legacy"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs"] }
toml = "1.1.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
assert_cmd = "2.2.2"
